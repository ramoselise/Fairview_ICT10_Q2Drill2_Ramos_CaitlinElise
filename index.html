<!DOCTYPE html>

<style>
        body {
            background: #ffffff
            min-height: 100vh;
            font-family: Times New Roman;
        }
        .club-container {
            max-width: 600px;
            margin: 50px auto;

            color: #fff;

        }
        .btn-custom:hover {
            background-color: #ffffff;
            color: #fff;
        }

</head>
<body>
    <div class="container club-container">

        <h2 class="mb-4 fs-4 fw-bold">ADD NEW CLUB MEMBER:</h2>
